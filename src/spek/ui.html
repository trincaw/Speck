<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ENGINE_NAME}} Streaming</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b21;
      --primary: #76b900;
      --primary-hover: #8de300;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --border: #2a2e37;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      color: var(--primary);
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
    }
    .model-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
      min-width: 180px;
    }
    label {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button {
      background: #232730;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    select:focus {
      border-color: var(--primary);
    }
    .btn-record {
      background: var(--primary);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      min-width: 160px;
      padding: 0.75rem 1.25rem;
    }
    .btn-record:hover {
      background: var(--primary-hover);
    }
    .btn-record.recording {
      background: #ef4444;
      color: white;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
    .transcript-box {
      background: #0d0e12;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 180px;
      max-height: 350px;
      overflow-y: auto;
      padding: 1.25rem;
      font-size: 1.15rem;
      color: #f3f4f6;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.2rem;
      background: var(--primary);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #272c38;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>{{ENGINE_NAME}} Streaming</h1>
      <p class="subtitle">Model-Agnostic Real-Time Speech Recognition Interface</p>
      <div class="model-badge">Active Model: <strong>{{MODEL_ID}}</strong> ({{ENGINE_NAME}})</div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="controls">
          <div class="control-group">
            <label for="languageSelect">Language / Locale</label>
            <select id="languageSelect">
              {{LANGUAGE_OPTIONS}}
            </select>
          </div>

          <div class="control-group">
            <label for="lookaheadSelect">Streaming Latency</label>
            <select id="lookaheadSelect">
              {{PRESET_OPTIONS}}
            </select>
          </div>

          <div class="control-group" style="align-self: flex-end;">
            <button id="recordBtn" class="btn-record">
              <span id="recordIcon">🎙️</span>
              <span id="recordLabel">Start Live Mic</span>
            </button>
          </div>
        </div>

        <div class="transcript-box" id="transcriptBox">
          <span id="transcriptText">Click "Start Live Mic" and speak...</span>
          <span class="cursor" id="cursor" style="display: none;"></span>
        </div>

        <div class="status-bar">
          <div>Status: <span id="statusLabel" class="badge">Idle</span></div>
          <div id="speakerBox" style="display: none;">Speaking: <span id="speakerLabel" class="badge">–</span></div>
          <div>Emitted: <span id="tokenCount">0</span> tokens | Session Time: <span id="sessionTimer">0.0s</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isRecording = false;
    let ws = null;
    let audioContext = null;
    let processorNode = null;
    let micStream = null;
    let startTime = 0;
    let timerInterval = null;
    let tokenCounter = 0;

    const recordBtn = document.getElementById('recordBtn');
    const recordLabel = document.getElementById('recordLabel');
    const transcriptText = document.getElementById('transcriptText');
    const cursor = document.getElementById('cursor');
    const statusLabel = document.getElementById('statusLabel');
    const tokenCount = document.getElementById('tokenCount');
    const speakerBox = document.getElementById('speakerBox');
    const speakerLabel = document.getElementById('speakerLabel');
    const sessionTimer = document.getElementById('sessionTimer');
    const languageSelect = document.getElementById('languageSelect');
    const lookaheadSelect = document.getElementById('lookaheadSelect');

    recordBtn.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function startRecording() {
      try {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws/stream`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = async () => {
          ws.send(JSON.stringify({
            type: 'config',
            language: languageSelect.value,
            lookahead: parseInt(lookaheadSelect.value, 10) || 6,
            skip_special_tokens: true
          }));

          audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
          const source = audioContext.createMediaStreamSource(micStream);

          // Buffer size: 4096 samples (~256ms chunk)
          processorNode = audioContext.createScriptProcessor(4096, 1, 1);
          processorNode.onaudioprocess = (e) => {
            if (!isRecording || ws.readyState !== WebSocket.OPEN) return;
            const inputData = e.inputBuffer.getChannelData(0);
            ws.send(inputData.buffer);
          };

          source.connect(processorNode);
          processorNode.connect(audioContext.destination);

          isRecording = true;
          recordBtn.classList.add('recording');
          recordLabel.textContent = 'Stop Recording';
          statusLabel.textContent = 'Streaming Live';
          statusLabel.style.color = '#76b900';
          transcriptText.textContent = '';
          cursor.style.display = 'inline-block';
          tokenCounter = 0;
          tokenCount.textContent = '0';
          speakerLabel.textContent = '–';
          startTime = Date.now();
          timerInterval = setInterval(() => {
            sessionTimer.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
          }, 100);
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === 'token') {
            transcriptText.textContent += msg.text;
            tokenCounter++;
            tokenCount.textContent = tokenCounter;
            const box = document.getElementById('transcriptBox');
            box.scrollTop = box.scrollHeight;
          } else if (msg.type === 'speaker') {
            // Provisional labels (still talking) are shown dimmed until the turn is final
            speakerBox.style.display = '';
            speakerLabel.textContent = msg.label === '?' ? 'new voice…' : msg.label;
            speakerLabel.style.opacity = msg.provisional ? '0.6' : '1';
            speakerLabel.style.fontStyle = msg.provisional ? 'italic' : 'normal';
          } else if (msg.type === 'done') {
            statusLabel.textContent = 'Completed';
            statusLabel.style.color = '#2563eb';
            cursor.style.display = 'none';
          }
        };

        ws.onclose = () => {
          stopRecording();
        };

        ws.onerror = (err) => {
          console.error('WebSocket Error:', err);
          stopRecording();
        };

      } catch (err) {
        alert('Microphone access denied or error: ' + err.message);
        stopRecording();
      }
    }

    function stopRecording() {
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordLabel.textContent = 'Start Live Mic';
      cursor.style.display = 'none';
      if (timerInterval) clearInterval(timerInterval);

      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
        audioContext = null;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'eof' }));
      }
    }
  </script>
</body>
</html>
