[project]
name = "spek"
version = "0.2.0"
description = "Model-agnostic real-time ASR with live speaker classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.26",
    "requests>=2.31",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "soundfile>=0.14.0",
    "torch>=2.1.0",
    "transformers>=5.13.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.5.6"]
cli = ["rich>=13.0.0", "sounddevice>=0.5.6"]

[project.scripts]
spek = "spek.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "spek[cli]",
]
